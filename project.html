<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="description" content="Ling's Portfolio Website">
  <meta name="author" content="Ling">
  <title>Ling's Portfolio</title>
  <meta name="keywords" content="Portfolio, Ling, Web Development, Projects, Blogs">

<header>
  <nav>
    <a href="index.html" class="logo">Projects</a>

      <li><a href="index.html">Home</a></li>

 </header>

 <main>

<h2>My Projects</h2>
<p>Here is some of the most recent projects I have worked on this year.</p>

<div class="project-controls">
    <input 
        type="text" 
        id="search-input" 
        placeholder="Search projects..."
        aria-label="Search projects"
    >

    <select id="category-filter" aria-label="Filter projects by category">
        <option value="all">All categories</option>
        <option value="Webdevelopment">Webdevelopment</option>
        <option value="Python">Python</option>
    </select>

    <select id="sort-select" aria-label="Sort projects">
        <option value="default">Default</option>
        <option value="name-asc">Name A-Z</option>
        <option value="name-desc">Name Z-A</option>
        <option value="year-new">Year newest</option>
        <option value="year-old">Year oldest</option>
    </select>
</div>

<section class="projects" id="projects-container">
</section>
</main>

<footer>
