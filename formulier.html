<body>
<header>
  <nav>
    <a href="index.html" class="logo">Contact</a>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="project.html">Projects</a></li>
      <li><a href="blog.html">Blogs</a></li>
      <li><a href="formulier.html">Contact me!</a></li>

</header>

<main>
<section class="contact-header">
      <h1>Get in Touch</h1>

      <p>
        Have a question, want to discuss a project, or simply want to connect?
        Feel free to send me a message using the form below.
      </p>
    </section>

	<form id="contact-form" action="#" method="post">
		<label for="name">Name</label>
		<input type="text" id="name" required minlength="2" aria-describedby="name-error" aria-invalid="false">
        <span id="name-error" role="alert"></span>

		<label for="email">E-mail</label>
		<input type="email" id="email" required aria-describedby="email-error" aria-invalid="false">
        <span id="email-error" role="alert"></span>

		<label for="message">Extra</label>
		<textarea id="message" required minlength="10" aria-describedby="message-error" aria-invalid="false"></textarea>
        <span id="message-error" role="alert"></span>

		<button type="submit">Submit</button>
        <div id="form-status" aria-live="polite"></div>
	</form>

	<script src="./javascript/form.js"></script>
</main>

<footer>
  <p>&copy; 2026 Ling's Portfolio. </p>
</footer>

</body>
